name: Tests

on:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.0-alpine3.18
        env:
          POSTGRES_USER: local_user
          POSTGRES_PASSWORD: local_password
          POSTGRES_DB: local_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://local_user:local_password@localhost:5432/local_db
      POSTGRES_DB: local_db
      JWT_SECRET: ci-secret-apenas-para-testes-nao-usar-em-producao
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Criar .env.development para o CI
        run: |
          echo "DATABASE_URL=$DATABASE_URL" >> .env.development
          echo "POSTGRES_DB=$POSTGRES_DB" >> .env.development
          echo "JWT_SECRET=$JWT_SECRET" >> .env.development
          echo "NEXT_PUBLIC_APP_URL=$NEXT_PUBLIC_APP_URL" >> .env.development
      - run: npm test
